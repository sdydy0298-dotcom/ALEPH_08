<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>나의 기록 | SEO DONG YEON</title>
<link rel="stylesheet" href="private.css"><link rel="stylesheet" href="records.css">
</head>
<body><div class="page">
<header class="nav"><a class="brand" href="/"><span class="brand-dot"></span> SEO DONG YEON</a><div class="right"><span class="chip">MY NOTES</span><a class="back" href="/private.html">← 보관함</a></div></header>
<main>
<section class="records-hero"><p class="kicker">PRIVATE WORKSPACE / MY NOTES</p><h1>나의 기록, <em>직접 작성하기.</em></h1><p>패스키로 인증한 계정에만 기록이 보관됩니다.</p></section>
<section id="records-auth" class="records-empty" hidden><h2>로그인이 필요합니다</h2><p>보관함에서 패스키로 로그인해 주세요.</p><a href="/private.html">패스키 로그인 →</a></section>
<section id="records-app" hidden>
<div class="records-status"><strong><span id="records-user"></span>의 기록</strong><span><b id="records-count">0</b>개</span></div>
<div class="records-layout">
<section class="records-panel"><div class="records-label">01 · WRITE <button id="new-record" type="button">+ 새 기록</button></div><h2 id="editor-heading">새 기록 작성</h2>
<form id="record-form">
<label for="record-title">제목</label><input id="record-title" maxlength="120" required placeholder="기록 제목">
<label for="record-content">내용</label><textarea id="record-content" maxlength="10000" rows="11" required placeholder="기억하고 싶은 내용을 입력하세요."></textarea>
<div class="records-caption"><span>나에게만 공개</span><span id="record-length">0 / 10,000</span></div>
<div class="records-actions"><button id="cancel-edit" type="button" hidden>취소</button><button id="record-submit" type="submit">기록 저장 →</button></div></form></section>
<section class="records-panel"><div class="records-label">02 · COLLECTION</div><h2>저장된 기록</h2><p class="records-desc">수정하거나 삭제할 기록을 선택하세요.</p><div id="records-list" aria-live="polite"></div></section>
</div></section>
<p id="records-message" role="status"></p>
</main><footer>© 2026 SEO DONG YEON</footer></div>
<script type="module" src="records.js"></script></body></html>
